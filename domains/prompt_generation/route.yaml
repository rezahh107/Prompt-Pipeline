domain: prompt_generation
version: "2026.3"

subtypes:
  - id: delegated_domain_prompt
    description: "Generate a prompt using a canonically resolved specialized target Domain plan."
    triggers:
      - "delegated_target_available == true"
    templates:
      primary: master-prompt.j2
  - id: master_prompt
    description: "Generate a production-grade reusable prompt from a user request."
    is_default: true
    templates:
      primary: master-prompt.j2

risk_overrides:
  - condition: "sensitive_or_high_risk == true"
    risk: high
  - condition: "uses_external_tools == true"
    risk: high
  - condition: "requires_current_information == true"
    risk: medium
  - condition: "requires_structured_output == true && potential_downstream_execution != false"
    risk: medium
    note: "Structured output remains medium unless Runtime has a non-executing context; benign resolution still requires all consequential factors to be absent."
